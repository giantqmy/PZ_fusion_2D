# PIM backbone + SAFF-PAN without depth-gated fusion.
#
# The input remains 9-channel for compatibility with the current data loader.
# channel1 selects RGB + DoLP_rgb, so the depth channel is not used by this model.

ch: 9
nc: 80  # Overridden by the dataset class count during training.

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  # PIM stage args: [channels, stage_id, ConvNeXt depth, downsample stride]
  # SAFF lateral args: [channels, topk, n_win, KV downsample ratio]

  - [-1, 1, channel1, []]                                      # 0: RGB (3) + DoLP_rgb (1)

  - [-1, 1, ChannelSplitPIMStage, [128, 0, 1, 4]]              # 1: P2/4 PIM backbone state
  - [1, 1, SAFFLateralFusion, [128, 2, 16, 4]]                # 2: P2/4 SAFF lateral

  - [1, 1, ChannelSplitPIMStage, [256, 1, 1, 2]]              # 3: P3/8 PIM backbone state
  - [3, 1, SAFFLateralFusion, [256, 2, 8, 4]]                 # 4: P3/8 SAFF lateral

  - [3, 1, ChannelSplitPIMStage, [512, 2, 2, 2]]              # 5: P4/16 PIM backbone state
  - [5, 1, SAFFLateralFusion, [512, 4, 4, 4]]                 # 6: P4/16 SAFF lateral

  - [5, 1, ChannelSplitPIMStage, [1024, 3, 1, 2]]              # 7: P5/32 PIM backbone state
  - [7, 1, SAFFLateralFusion, [1024, 8, 4, 2]]                # 8: P5/32 SAFF lateral

# Four-scale PAN-FPN using direct SAFF lateral features at P2/P3/P4/P5.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 9
  - [[-1, 6], 1, Concat, [1]]                                 # 10: P5 upsample + SAFF P4
  - [-1, 2, C3k2, [512, False]]                               # 11: top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 12
  - [[-1, 4], 1, Concat, [1]]                                 # 13: head P4 upsample + SAFF P3
  - [-1, 2, C3k2, [256, False]]                               # 14: top-down P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 15
  - [[-1, 2], 1, Concat, [1]]                                 # 16: head P3 upsample + SAFF P2
  - [-1, 2, C3k2, [128, False]]                               # 17: P2/4-small

  - [-1, 1, Conv, [128, 3, 2]]                                # 18
  - [[-1, 14], 1, Concat, [1]]                                # 19: bottom-up P3
  - [-1, 2, C3k2, [256, False]]                               # 20: P3/8-medium

  - [-1, 1, Conv, [256, 3, 2]]                                # 21
  - [[-1, 11], 1, Concat, [1]]                                # 22: bottom-up P4
  - [-1, 2, C3k2, [512, False]]                               # 23: P4/16-large

  - [-1, 1, Conv, [512, 3, 2]]                                # 24
  - [[-1, 8], 1, Concat, [1]]                                 # 25: bottom-up P5 + SAFF P5
  - [-1, 2, C3k2, [1024, True]]                               # 26: P5/32-xlarge

  - [[17, 20, 23, 26], 1, Detect, [nc]]                       # 27: Detect(P2, P3, P4, P5)
