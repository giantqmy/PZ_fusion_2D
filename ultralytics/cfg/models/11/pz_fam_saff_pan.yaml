# Ultralytics AGPL-3.0 License
# FAM backbone + SAFF-PAN; depth-gated SAFF features feed PAN-FPN laterals.

ch: 9
nc: 80

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  # FAM stage args: [channels, stage_id, ConvNeXt depth, downsample stride, optional two-step stem]
  # SAFF lateral args: [channels, topk, n_win, KV downsample ratio]
  # DepthGate args: [depth channel after Format(), depth encoder block count, raw-input downsample stride]
  - [-1, 1, nn.Identity, []]                                  # 0: preserve normalized raw 9-channel input
  - [0, 1, channel1, []]                                      # 1: RGB S0 (3) + DoLP (1)
  - [-1, 1, ChannelSplitFAMStage, [128, 0, 1, 4, True]]       # 2: P2/4 FAM backbone state
  - [2, 1, SAFFLateralFusion, [128, 2, 16, 4]]                # 3: P2/4 SAFF lateral
  - [[3, 0], 1, DepthGate, [0, 1, 4]]                         # 4: depth-gated P2 lateral
  - [2, 1, ChannelSplitFAMStage, [256, 1, 1, 2]]              # 5: P3/8 FAM backbone state
  - [5, 1, SAFFLateralFusion, [256, 2, 8, 4]]                 # 6: P3/8 SAFF lateral
  - [[6, 0], 1, DepthGate, [0, 1, 8]]                         # 7: depth-gated P3 lateral
  - [5, 1, ChannelSplitFAMStage, [512, 2, 2, 2]]              # 8: P4/16 FAM backbone state
  - [8, 1, SAFFLateralFusion, [512, 4, 4, 4]]                 # 9: P4/16 SAFF lateral
  - [[9, 0], 1, DepthGate, [0, 1, 16]]                        # 10: depth-gated P4 lateral
  - [8, 1, ChannelSplitFAMStage, [1024, 3, 1, 2]]             # 11: P5/32 FAM backbone state
  - [11, 1, SAFFLateralFusion, [1024, 8, 4, 2]]              # 12: P5/32 SAFF lateral
  - [[12, 0], 1, DepthGate, [0, 1, 32]]                       # 13: depth-gated P5 lateral

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[22, 25, 28, 31], 1, Detect, [nc]]
