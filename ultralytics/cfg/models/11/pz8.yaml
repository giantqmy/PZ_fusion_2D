# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect
ch: 9
# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  # s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  # m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  # l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  # x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  # - [-1, 1, StackedChannelSplitFusion, [96,4]] #ultralytics 会被翻译成StackedChannelSplitFusion(c_in=8, 4, 96)
  # - [-1, 1, ChannelSplitBlockFusion, [96]]
  # - [-1, 1, ChannelSplitBlockFusion, [128]]
  # - [-1, 1, ChannelSplitBlockFusion, [192]]
  # - [-1, 1, ChannelSplitBlockFusion, [256]]
  # - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2  不能加第一个卷积 
  - [-1, 1, channel1, [64]] #0
  # - [-1, 1, ChannelSplitBlockFusion, [128]] #1 1/4
  # - [-1, 1, ChannelSplitBlockFusion, [256]] #2 1/8
  # - [-1, 1, ChannelSplitBlockFusion, [512]] #3 1/16
  # - [-1, 1, ChannelSplitBlockFusion, [1024]] #4 1/32
  - [-1, 1, ChannelSplitBlockFusion, [128, 1, 8]]  #1 stage 1 c_in, dim=96, mbf_topk=4,mbf_n_win=8
  - [-1, 1, ChannelSplitBlockFusion, [256, 4, 8]]   #2 stage 2
  - [-1, 1, ChannelSplitBlockFusion, [512, 4, 4]]   #3 stage 3
  - [-1, 1, ChannelSplitBlockFusion, [1024,4, 4]]   #4 stage 4
#[0-4层]

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #最近邻插值速度快，内存开销小
  - [[-1, 3], 1, Concat, [1]] # cat backbone P4 #6
  - [-1, 1, C3k2, [512, 3, 1]]  #7

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #8
  - [[-1, 2], 1, Concat, [1]] # cat backbone P4 #9
  - [-1, 1, C3k2, [256, 3, 1]] #10
  - [[10, 7, 4], 1, Detect, [nc]]   #11
  # - [10, 1, DEA, [256]]             # 11 → P3'
  # - [7,  1, DEA, [512]]             # 12 → P4'
  # - [4,  1, DEA, [1024]]            # 13 → P5'
  # - [[11, 12, 13], 1, Detect, [nc]]


