# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect
ch: 9
# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  n: [0.50, 0.25, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs


# YOLO11n backbone
backbone:
  - [-1, 1, channel1, [64]] #0
  - [-1, 1, ChannelSplitBlockFusion, [128, 1, 16,0]]  #1 stage 1 c_in, dim=96, mbf_topk=4,mbf_n_win=8
  - [-1, 2, C3k2, [256, False, 0.25]] #2
  - [-1, 1, ChannelSplitBlockFusion, [256, 2, 16,1]]   #3 stage 2
  - [-1, 2, C3k2, [512, False, 0.25]] #4
  - [-1, 1, ChannelSplitBlockFusion, [512, 4,16,2]]   #5 stage 3
  - [-1, 2, C3k2, [512, True]] #6
  - [-1, 1, ChannelSplitBlockFusion, [1024,16,16,3]]   #7 stage 4
  - [-1, 2, C3k2, [1024, True]]#8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

#803  26,548,343  26,548,327
#[0-4层]

# YOLO11n head

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)


