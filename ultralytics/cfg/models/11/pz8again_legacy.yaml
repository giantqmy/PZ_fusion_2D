# Legacy pz8again architecture retained for reproducibility.
ch: 9
nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, channel1, [64]]
  - [-1, 1, ChannelSplitBlockFusion, [128, 1, 8, 0]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, ChannelSplitBlockFusion, [256, 2, 8, 1]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, ChannelSplitBlockFusion, [512, 4, 4, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, ChannelSplitBlockFusion, [1024, 16, 4, 3]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[16, 19, 22], 1, Detect, [nc]]
