# PIM features continue through the dual-branch backbone; depth-gated SAFF features feed PAN-FPN laterals.

ch: 9
nc: 80  # Overridden by the dataset class count during training.

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  # PIM stage args: [channels, stage_id, ConvNeXt depth, downsample stride]
  # SAFF lateral args: [channels, topk, n_win, KV downsample ratio]
  # DepthGate args: [depth channel after Format(), depth encoder block count, raw-input downsample stride].
  # The data pipeline converts uint16(depth_m * 256) to a global Z-score.
  - [-1, 1, nn.Identity, []]                                  # 0: preserve normalized raw 9-channel input
  - [0, 1, channel1, []]                                      # 1: RGB S0 (3) + DoLP (1)
  - [-1, 1, ChannelSplitPIMStage, [128, 0, 1, 4]]             # 2: P2/4 PIM backbone state
  - [2, 1, SAFFLateralFusion, [128, 2, 16, 4]]                # 3: P2/4 SAFF lateral
  - [[3, 0], 1, DepthGate, [0, 1, 4]]                         # 4: depth-gated P2 lateral
  - [2, 1, ChannelSplitPIMStage, [256, 1, 1, 2]]              # 5: P3/8 PIM backbone state
  - [5, 1, SAFFLateralFusion, [256, 2, 8, 4]]                 # 6: P3/8 SAFF lateral
  - [[6, 0], 1, DepthGate, [0, 1, 8]]                         # 7: depth-gated P3 lateral
  - [5, 1, ChannelSplitPIMStage, [512, 2, 2, 2]]              # 8: P4/16 PIM backbone state
  - [8, 1, SAFFLateralFusion, [512, 4, 4, 4]]                 # 9: P4/16 SAFF lateral
  - [[9, 0], 1, DepthGate, [0, 1, 16]]                        # 10: depth-gated P4 lateral
  - [8, 1, ChannelSplitPIMStage, [1024, 3, 1, 2]]             # 11: P5/32 PIM backbone state
  - [11, 1, SAFFLateralFusion, [1024, 8, 4, 2]]               # 12: P5/32 SAFF lateral
  - [[12, 0], 1, DepthGate, [0, 1, 32]]                       # 13: depth-gated P5 lateral

# Four-scale PAN-FPN using SAFF lateral features at P2/P3/P4/P5.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 14
  - [[-1, 10], 1, Concat, [1]]                               # 15: P5 upsample + gated P4
  - [-1, 2, C3k2, [512, False]]                              # 16: top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]               # 17
  - [[-1, 7], 1, Concat, [1]]                                # 18: head P4 upsample + gated P3
  - [-1, 2, C3k2, [256, False]]                              # 19: top-down P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]               # 20
  - [[-1, 4], 1, Concat, [1]]                                # 21: head P3 upsample + gated P2
  - [-1, 2, C3k2, [128, False]]                              # 22: P2/4-small

  - [-1, 1, Conv, [128, 3, 2]]                               # 23
  - [[-1, 19], 1, Concat, [1]]                               # 24: bottom-up P3
  - [-1, 2, C3k2, [256, False]]                              # 25: P3/8-medium

  - [-1, 1, Conv, [256, 3, 2]]                               # 26
  - [[-1, 16], 1, Concat, [1]]                               # 27: bottom-up P4
  - [-1, 2, C3k2, [512, False]]                              # 28: P4/16-large

  - [-1, 1, Conv, [512, 3, 2]]                               # 29
  - [[-1, 13], 1, Concat, [1]]                               # 30: bottom-up P5 + gated P5
  - [-1, 2, C3k2, [1024, True]]                              # 31: P5/32-xlarge

  - [[22, 25, 28, 31], 1, Detect, [nc]]                      # 32: Detect(P2, P3, P4, P5)
